<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Email Desk</title><link rel="stylesheet" href="styles.css"></head><body><header><h1>Email Desk</h1><nav aria-label="Board controls"><button id="refresh" title="Reload saved cards; does not start an inbox review" hidden>Refresh</button><button id="logout" hidden>Sign out</button></nav></header><main><section id="login" hidden><form id="loginForm" class="login-box"><label for="password">Your Email Desk password</label><input id="password" type="password" autocomplete="current-password" required maxlength="500"><button type="submit" class="primary">Sign in</button></form></section><div id="error" role="alert" hidden></div><section id="workspace" hidden><details id="scan" class="scan" hidden><summary id="scanTitle"></summary><p id="scanDetails"></p></details><div id="empty" class="empty" hidden>No active cards.</div><section id="board" class="board" aria-label="Email attention board"><section aria-labelledby="actionTitle"><div class="column-heading"><h2 id="actionTitle">Needs action</h2><span id="actionCount">0</span></div><div id="actionCards"></div></section><section aria-labelledby="awarenessTitle"><div class="column-heading"><h2 id="awarenessTitle">Worth knowing</h2><span id="awarenessCount">0</span></div><div id="awarenessCards"></div></section></section><details id="history" class="history" hidden><summary id="historyTitle">Handled</summary><div id="historyCards"></div></details></section></main><script src="app.js" defer></script></body></html>
