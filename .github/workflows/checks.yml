name: Project checks
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install PHP test runtime
        run: sudo apt-get update && sudo apt-get install -y php-cli php-sqlite3
      - name: Install isolated reviewer test dependencies
        run: |
          python3 -m venv .private/hosted-reviewer/venv
          .private/hosted-reviewer/venv/bin/python -m pip install --disable-pip-version-check -r scripts/hosted-reviewer-requirements.txt
      - name: Check source
        run: |
          npm ci
          npm run build
          git diff --exit-code -- public/app.js public/styles.css
          npm run check
          python3 tests/provision_checks.py
          python3 tests/release_checks.py
          python3 tests/github_deploy_checks.py
          find server public tests -name '*.php' -exec php -l {} \;
          python3 -m py_compile scripts/*.py tests/*.py
          python3 -m py_compile reviewer/*.py
          .private/hosted-reviewer/venv/bin/python tests/reviewer_state_seed.py
          .private/hosted-reviewer/venv/bin/python tests/reviewer_authorization.py
          .private/hosted-reviewer/venv/bin/python tests/reviewer_pilot.py
          .private/hosted-reviewer/venv/bin/python tests/hosted_reviewer.py
          .private/hosted-reviewer/venv/bin/python tests/reporting.py
          python3 tests/hosted_reviewer_provision.py
      - name: Verify storage and HTTP API
        run: |
          php tests/store.php
          python3 tests/api_checks.py
