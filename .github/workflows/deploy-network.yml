name: Public deployment network diagnostics
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/deploy-network-check.py
      - .github/workflows/deploy-network.yml
permissions:
  contents: read
jobs:
  public-https:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compare public HTTPS connections without credentials
        run: python3 scripts/deploy-network-check.py
